name: Android Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build installable APK
        run: gradle clean assembleDebug --no-daemon

      - name: Name APK
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}"
          cp app/build/outputs/apk/debug/app-debug.apk "WOSGiftRedeemer-v1.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WOSGiftRedeemer-APK
          path: WOSGiftRedeemer-v1.apk

      - name: Create GitHub Release and attach APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: WOSGiftRedeemer-${{ github.ref_name }}.apk
